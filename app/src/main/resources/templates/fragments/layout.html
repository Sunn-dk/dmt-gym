<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — DMT Gym'">DMT Gym</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.ico}">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('gym-theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar" th:fragment="topbar">
    <a class="skip-link" href="#main-content">Bỏ qua tới nội dung chính</a>
    <div class="topbar-brand">
        <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M12 6.5v11"/>
            </svg>
        </span>
        <span>DMT GYM</span>
    </div>
    <div class="topbar-meta">
        <div class="theme-toggle no-print" role="group" aria-label="Chuyển chế độ giao diện">
            <button type="button" class="theme-btn" id="btnThemeLight" onclick="setGymTheme('light')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                Light
            </button>
            <button type="button" class="theme-btn" id="btnThemeDark" onclick="setGymTheme('dark')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                Dark
            </button>
        </div>

        <span class="clock-chip" th:text="${#temporals.format(serverNow, 'dd/MM/yyyy HH:mm')}">18/11/2026 05:30</span>
        <span class="user-chip" th:if="${currentUser != null}"
              th:text="${currentUser.fullName() + ' · ' + currentUser.role().label}">Nhân viên</span>
        <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" class="no-print">
            <button type="submit" class="secondary sm">Đăng xuất</button>
        </form>
        <button th:if="${currentUser != null}"
                type="button"
                class="nav-toggle-btn secondary sm no-print"
                id="btnNavToggle"
                aria-expanded="false"
                aria-controls="primarySidebar"
                onclick="toggleMobileNav()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span>Menu</span>
        </button>
    </div>
    <script>
        function setGymTheme(mode) {
            document.documentElement.setAttribute('data-theme', mode);
            try { localStorage.setItem('gym-theme', mode); } catch (e) {}
            syncThemeButtons(mode);
        }
        function syncThemeButtons(mode) {
            var active = mode || document.documentElement.getAttribute('data-theme') || 'light';
            var l = document.getElementById('btnThemeLight');
            var d = document.getElementById('btnThemeDark');
            if (l && d) {
                l.classList.toggle('is-active', active !== 'dark');
                d.classList.toggle('is-active', active === 'dark');
                l.setAttribute('aria-pressed', active !== 'dark');
                d.setAttribute('aria-pressed', active === 'dark');
            }
        }
        function toggleMobileNav() {
            var nav = document.getElementById('primarySidebar');
            var btn = document.getElementById('btnNavToggle');
            if (!nav || !btn) return;
            var open = nav.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        document.addEventListener('DOMContentLoaded', function () { syncThemeButtons(); });
    </script>
</header>

<nav class="sidebar no-print" id="primarySidebar" aria-label="Điều hướng chính" th:fragment="sidebar" th:if="${currentUser != null}">
    <div class="nav-sep">Quầy tiếp nhận</div>
    <a th:if="${currentUser.role().name() != 'TRAINER'}"
       th:href="@{/members}"
       th:classappend="${#strings.startsWith(currentPath, '/members') or #strings.startsWith(currentPath, '/sales') or #strings.startsWith(currentPath, '/receipts') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Hội viên</span>
    </a>
    <a th:if="${currentUser.role().name() != 'TRAINER'}"
       th:href="@{/plans}"
       th:classappend="${#strings.startsWith(currentPath, '/plans') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <span>Gói tập</span>
    </a>
    <a th:if="${currentUser.role().name() != 'TRAINER'}"
       th:href="@{/visits}"
       th:classappend="${#strings.startsWith(currentPath, '/visits') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>Ra / vào gym</span>
    </a>

    <div class="nav-sep">PT &amp; Lịch tập</div>
    <a th:href="@{/trainers}"
       th:classappend="${#strings.startsWith(currentPath, '/trainers') or #strings.startsWith(currentPath, '/availability') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>PT &amp; Giờ làm</span>
    </a>
    <a th:href="@{/pt-bookings}"
       th:classappend="${#strings.startsWith(currentPath, '/pt-bookings') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Lịch &amp; Kết quả PT</span>
    </a>

    <div class="nav-sep" th:if="${currentUser.role().name() == 'MANAGER'}">Quản trị</div>
    <a th:if="${currentUser.role().name() == 'MANAGER'}"
       th:href="@{/reports}"
       th:classappend="${#strings.startsWith(currentPath, '/reports') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>Báo cáo tổng hợp</span>
    </a>
    <a th:if="${currentUser.role().name() == 'MANAGER'}"
       th:href="@{/users}"
       th:classappend="${#strings.startsWith(currentPath, '/users') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Tài khoản</span>
    </a>

    <div class="nav-sep">Cơ sở vật chất</div>
    <a th:href="@{/equipment}"
       th:classappend="${#strings.startsWith(currentPath, '/equipment') ? 'active' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span>Thiết bị</span>
    </a>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success" role="status" aria-live="polite" th:if="${successMessage != null}">
        <strong>Thành công:</strong> <span th:text="${successMessage}"></span>
    </div>
    <div class="alert alert-error" role="alert" aria-live="assertive" th:if="${errorMessage != null}">
        <strong>Không thể thực hiện:</strong>
        <span th:text="${errorMessage}"></span>
        <ul th:if="${errorDetails != null and !#lists.isEmpty(errorDetails)}">
            <li th:each="d : ${errorDetails}" th:text="${d}"></li>
        </ul>
    </div>
</div>

<footer th:fragment="footer">
    DMT Gym · Hệ thống quản lý phòng tập
</footer>

</body>
</html>
