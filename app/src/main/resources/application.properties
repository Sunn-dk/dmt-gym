spring.application.name=gym-management

# Database (MySQL 8.4 / InnoDB / Asia/Ho_Chi_Minh)
spring.datasource.url=${GYM_DB_URL:jdbc:mysql://localhost:3306/gym_exam_demo?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
spring.datasource.username=${GYM_DB_USER:root}
spring.datasource.password=${GYM_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# Disable Spring Boot automatic sql.init; handled safely & non-destructively by DatabaseBootstrap
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Session timeout 30 minutes (NFR-02)
server.servlet.session.timeout=30m
server.port=${GYM_PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Demo bootstrap settings (only runs when users table is empty)
gym.demo.password=${GYM_DEMO_PASSWORD:Gym@12345}
gym.bootstrap.enabled=${GYM_BOOTSTRAP_ENABLED:true}
